# -- FILE: pytest.ini
[pytest]
# Python test file patterns
python_files = tests.py test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# Additional options
addopts =
    -v
    --strict-markers
    --tb=short
    --cov=core
    --cov=backend
    --cov-report=term-missing
    --cov-report=html:htmlcov
    --cov-report=xml:coverage.xml
    --cov-fail-under=80
    --ignore=.virtualenvs

# Test discovery
testpaths = tests

# Markers
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    unit: marks tests as unit tests

# Coverage configuration
[coverage:run]
source = core,backend
omit =
    */tests/*
    */__pycache__/*
    */virtualenvs/*
    */.virtualenvs/*
    */venv/*
    */.venv/*
    */demo.py
    */main.py

[coverage:report]
precision = 2
show_missing = True
skip_covered = False
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstractmethod
