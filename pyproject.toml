[project]
name = "eleicoes-urna-eletronica"
version = "0.1.0"
description = ""
authors = [{ name = "Marcus Vinicus Braga", email = "mvbraga@gmail.com" }]
requires-python = ">=3.15"
readme = "readme.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.15",
]
dependencies = [
    "pillow>=12.3.0,<13",
    "pyzbar>=0.1.9,<0.2",
    "pydantic>=2.7.2,<3",
    "pydantic-settings>=2.2.1,<3",
    "scikit-learn>=1.5.0,<2",
    "cryptography>=42.0.7,<43",
    "qrcode>=7.4.2,<8",
    "fastapi>=0.111.0,<0.112",
    "python-dotenv>=1.0.1,<2",
    "jinja2>=3.1.4,<4",
    "loguru>=0.7.2,<0.8",
    "redis>=5.0.4,<6",
    "python-jose[cryptography]>=3.3.0,<4",
    "passlib[bcrypt]>=1.7.4,<2",
    "slowapi>=0.1.9,<0.2",
    "python-multipart>=0.0.9,<0.0.10",
    "uvicorn[standard]>=0.30.0,<0.31",
    "cachetools>=5.3.0,<6",
    "orjson>=3.9.0,<4",
]

[dependency-groups]
dev = [
    "ipython>=8.25.0,<9",
    "pytest>=8.2.1,<9",
    "flake8>=7.0.0,<8",
    "codecov>=2.1.13,<3",
    "coverage>=7.5.3,<8",
    "pytest-cov>=5.0.0,<6",
    "pytest-mock>=3.14.0,<4",
    "fakeredis>=2.21.3,<3",
    "httpx>=0.27.0,<0.28",
]

[tool.uv]
package = false
default-groups = "all"

[build-system]
requires = ["uv_build>=0.11.27,<0.12.0"]
build-backend = "uv_build"
