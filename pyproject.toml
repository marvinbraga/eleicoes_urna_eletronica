[tool.poetry]
name = "eleicoes-urna-eletronica"
version = "0.1.0"
description = ""
authors = ["Marcus Vinicus Braga <mvbraga@gmail.com>"]
readme = "readme.md"

[tool.poetry.dependencies]
python = "^3.10"
pillow = "^10.3.0"
pyzbar = "^0.1.9"
pydantic = "^2.7.2"
pydantic-settings = "^2.2.1"
scikit-learn = "^1.5.0"
cryptography = "^42.0.7"
qrcode = "^7.4.2"
fastapi = "^0.111.0"
python-dotenv = "^1.0.1"
jinja2 = "^3.1.4"
loguru = "^0.7.2"
redis = "^5.0.4"
python-jose = {extras = ["cryptography"], version = "^3.3.0"}
passlib = {extras = ["bcrypt"], version = "^1.7.4"}
slowapi = "^0.1.9"
python-multipart = "^0.0.9"
uvicorn = {extras = ["standard"], version = "^0.30.0"}
cachetools = "^5.3.0"
orjson = "^3.9.0"

[tool.poetry.group.dev.dependencies]
ipython = "^8.25.0"
pytest = "^8.2.1"
flake8 = "^7.0.0"
codecov = "^2.1.13"
coverage = "^7.5.3"
